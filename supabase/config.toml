# Supabase CLI config for local development. Unlisted keys use CLI defaults.
# Hosted projects are configured in the dashboard (see README).
project_id = "compound"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "compound://"
additional_redirect_urls = ["compound://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 900
max_frequency = "30s"

[auth.email.template.magic_link]
subject = "Your Compound sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Your Compound sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_BUNDLE_ID)"
secret = ""

[auth.external.google]
enabled = true
# Comma-separated list: web client id first, then the iOS client id.
client_id = "env(GOOGLE_CLIENT_IDS)"
secret = "env(GOOGLE_WEB_CLIENT_SECRET)"
# Native iOS Google Sign-In tokens carry a nonce we can't pass through.
skip_nonce_check = true

[edge_runtime]
enabled = true

[functions.delete-account]
verify_jwt = true
